name: Taksio iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: iOS platform ekle
        run: npx cap add ios

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Xcode seç
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Sertifika ve Provisioning Profile kur
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: App ikonunu yerleştir
        run: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"

          echo "${{ secrets.APP_ICON_BASE64 }}" | base64 --decode > /tmp/icon_1024.png

          brew install imagemagick -q || true

          declare -A SIZES=(
            ["Icon-20.png"]=20
            ["Icon-20@2x.png"]=40
            ["Icon-20@3x.png"]=60
            ["Icon-29.png"]=29
            ["Icon-29@2x.png"]=58
            ["Icon-29@3x.png"]=87
            ["Icon-40.png"]=40
            ["Icon-40@2x.png"]=80
            ["Icon-40@3x.png"]=120
            ["Icon-60@2x.png"]=120
            ["Icon-60@3x.png"]=180
            ["Icon-76.png"]=76
            ["Icon-76@2x.png"]=152
            ["Icon-83.5@2x.png"]=167
            ["Icon-1024.png"]=1024
          )

          for filename in "${!SIZES[@]}"; do
            size="${SIZES[$filename]}"
            convert /tmp/icon_1024.png -resize "${size}x${size}" "$ICON_DIR/$filename"
          done

          cat > "$ICON_DIR/Contents.json" << 'JSON'
          {
            "images": [
              {"size":"20x20","idiom":"iphone","scale":"2x","filename":"Icon-20@2x.png"},
              {"size":"20x20","idiom":"iphone","scale":"3x","filename":"Icon-20@3x.png"},
              {"size":"29x29","idiom":"iphone","scale":"2x","filename":"Icon-29@2x.png"},
              {"size":"29x29","idiom":"iphone","scale":"3x","filename":"Icon-29@3x.png"},
              {"size":"40x40","idiom":"iphone","scale":"2x","filename":"Icon-40@2x.png"},
              {"size":"40x40","idiom":"iphone","scale":"3x","filename":"Icon-40@3x.png"},
              {"size":"60x60","idiom":"iphone","scale":"2x","filename":"Icon-60@2x.png"},
              {"size":"60x60","idiom":"iphone","scale":"3x","filename":"Icon-60@3x.png"},
              {"size":"20x20","idiom":"ipad","scale":"1x","filename":"Icon-20.png"},
              {"size":"20x20","idiom":"ipad","scale":"2x","filename":"Icon-20@2x.png"},
              {"size":"29x29","idiom":"ipad","scale":"1x","filename":"Icon-29.png"},
              {"size":"29x29","idiom":"ipad","scale":"2x","filename":"Icon-29@2x.png"},
              {"size":"40x40","idiom":"ipad","scale":"1x","filename":"Icon-40.png"},
              {"size":"40x40","idiom":"ipad","scale":"2x","filename":"Icon-40@2x.png"},
              {"size":"76x76","idiom":"ipad","scale":"1x","filename":"Icon-76.png"},
              {"size":"76x76","idiom":"ipad","scale":"2x","filename":"Icon-76@2x.png"},
              {"size":"83.5x83.5","idiom":"ipad","scale":"2x","filename":"Icon-83.5@2x.png"},
              {"size":"1024x1024","idiom":"ios-marketing","scale":"1x","filename":"Icon-1024.png"}
            ],
            "info":{"version":1,"author":"xcode"}
          }
          JSON

          echo "İkonlar hazır"
          ls "$ICON_DIR"

      - name: Xcodeproj signing düzelt
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_NAME }}
        run: |
          PBXPROJ=$(find ios -name "project.pbxproj" | grep "App.xcodeproj" | grep -v Pods | head -1)
          echo "Dosya: $PBXPROJ"

          python3 - "$PBXPROJ" "$TEAM_ID" "$PROFILE_NAME" << 'PYEOF'
          import sys, re
          path, team, profile = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path, "r") as f:
              content = f.read()
          content = content.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          if 'DEVELOPMENT_TEAM' in content:
              content = re.sub(r'DEVELOPMENT_TEAM = [A-Z0-9]*;', f'DEVELOPMENT_TEAM = {team};', content)
          else:
              content = content.replace('CODE_SIGN_STYLE = Manual;', f'CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = {team};')
          if 'PROVISIONING_PROFILE_SPECIFIER' in content:
              content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER = [^;]*;', f'PROVISIONING_PROFILE_SPECIFIER = "{profile}";', content)
          else:
              content = content.replace('CODE_SIGN_STYLE = Manual;', f'CODE_SIGN_STYLE = Manual;\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile}";')
          content = re.sub(r'"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "[^"]*";', '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";', content)
          if '"CODE_SIGN_IDENTITY[sdk=iphoneos*]"' not in content:
              content = content.replace('CODE_SIGN_STYLE = Manual;', 'CODE_SIGN_STYLE = Manual;\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";')
          with open(path, "w") as f:
              f.write(content)
          print("Signing guncellendi")
          PYEOF

      - name: IPA oluştur
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath $RUNNER_TEMP/Taksio.xcarchive \
            -destination "generic/platform=iOS" \
            archive

      - name: IPA export et
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>app.taksio.ios</key><string>${{ secrets.PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Taksio.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: IPA artifact kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Taksio-${{ github.sha }}.ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: App Store Connect'e yükle
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          # API key dosyasını oluştur
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          # Dosya içeriğini kontrol et
          echo "Key dosyası satır sayısı: $(wc -l < ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8)"
          head -1 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          # IPA bul
          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" | head -1)
          echo "IPA: $IPA_PATH"

          # xcrun notarytool yerine App Store Connect API ile yükle
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --private-key ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            --verbose

      - name: Keychain temizle
        if: always()
        run: |
          if security list-keychains | grep -q "app-signing"; then
            security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
          fi